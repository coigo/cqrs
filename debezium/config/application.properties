# Origem: Postgres
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=host.docker.internal
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=cqrs_writer
debezium.source.topic.prefix=app
debezium.source.table.include.list=public.events
debezium.source.slot.name=debezium_events

# Onde guarda o progresso
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# Snapshot: "initial" lê as linhas existentes uma vez e depois só o WAL
debezium.source.snapshot.mode=initial

# Formato: só o JSON da mudança, sem o schema embutido
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

debezium.sink.type=http
debezium.sink.http.url=http://host.docker.internal:8081/process

# Opcional: tempo limite e tentativas em caso de falha
debezium.sink.http.timeout.ms=5000
debezium.sink.http.retries=5
debezium.sink.http.retry.interval.ms=3000

# Evita enviar o "tombstone" (mensagem vazia) depois de cada delete
debezium.source.tombstones.on.delete=false